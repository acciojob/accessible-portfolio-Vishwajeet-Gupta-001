<!DOCTYPE html>

<html>

<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Accessible Portfolio</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <header>
        <h1 role="heading">My Portfolio</h1>
    </header>

	<nav role="navigation">
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
    </nav>

	<main>
        <section id="about">
            <img
                src="profile.jpg"
                alt="Profile picture of the portfolio owner"
                role="img"
                width="200"
            >

            <p>
                Hello! I am a passionate web developer interested
                in building accessible and user-friendly websites.
            </p>
        </section>

        <section id="skills">
            <h2>My Skills</h2>

            <ul role="list">
                <li role="listitem">HTML</li>
                <li role="listitem">CSS</li>
                <li role="listitem">JavaScript</li>
            </ul>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>
            <p>Email: example@email.com</p>
        </section>
    </main>
	
	<script type="text/javascript" src="./script.js">
</script>

</body>

</html>
